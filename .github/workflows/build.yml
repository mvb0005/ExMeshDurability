name: Build

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  # Allow triggering a build manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build mod JAR
        run: ./gradlew build --no-daemon
        env:
          # ForgeGradle needs enough heap to decompile Minecraft
          GRADLE_OPTS: "-Xmx3G"

      - name: Compute artifact name
        id: artifact_name
        run: |
          # Replace any forward slashes in branch name with hyphens
          SAFE_REF="${GITHUB_REF_NAME//\//-}"
          SHORT_SHA="${GITHUB_SHA::8}"
          echo "name=ExMeshDurability-${SAFE_REF}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact_name.outputs.name }}
          # 'build' produces both a plain JAR and the reobfuscated one;
          # the *-all.jar / plain jar in libs is the one ready to drop in mods/.
          # Exclude the *-sources.jar so only the usable mod JAR is attached.
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 90
